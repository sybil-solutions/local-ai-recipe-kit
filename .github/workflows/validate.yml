name: validate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  submissions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python3 -m py_compile tools/*.py
      - run: python3 tools/validate.py "submissions/**/*.json"
      - run: python3 tools/test_sweep_card.py
      - run: python3 tools/test_sweep_status.py
      - run: python3 tools/test_sweep_evidence.py
